[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to backend
[[redirects]]
  from = "/api/*"
  to = "https://rainwater-harvest-pro-2.onrender.com/api/:splat"
  status = 200
  force = true
  headers = { X-From = "Netlify" }   

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
